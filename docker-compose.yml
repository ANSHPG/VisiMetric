version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/anshumanpattnaik/visimetric-backend:latest
    container_name: visimetric-backend
    ports:
      - "8000:8000"
    environment:
      - MODEL_VERSION=efficientnet_b0_v1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/anshumanpattnaik/visimetric-frontend:latest
    container_name: visimetric-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
